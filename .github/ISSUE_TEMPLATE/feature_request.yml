name: Feature Request
description: Suggest a new feature or improvement for Palcore
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gameplay or workflow pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How would you expect this feature to work in the Desktop window or In-Game overlay?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context
      description: Any screenshots, mockups, or extra details.