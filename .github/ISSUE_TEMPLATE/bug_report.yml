name: Bug Report
description: Report a bug or unexpected behavior in Palcore
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please check existing issues before opening a new one.
  - type: input
    id: app-version
    attributes:
      label: Palcore Version
      description: Found in Settings or the Overwolf dock/app info (e.g., 1.0.3)
      placeholder: "1.0.3"
    validations:
      required: true
  - type: dropdown
    id: window-context
    attributes:
      label: Where did the issue occur?
      options:
        - Desktop Window
        - In-Game Overlay
        - Both / General
        - Save Parsing / Radar
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Launch Palworld...
        2. Open overlay with Ctrl+Shift+G...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, monitor setup (single/dual), and Palworld version/platform (Steam/Game Pass).
      placeholder: "Windows 11, Dual Monitor (1440p + 1080p), Steam"